# Private silent ALSA namespace for UU Remote's dedicated Wine prefix.
# Playback is discarded and capture returns silence; no physical PCM opens.
pcm.!default {
    type null
    hint {
        show on
        description "UU Remote Silent Audio"
    }
}

pcm.uu_remote_silent {
    type null
    hint {
        show on
        description "UU Remote Silent Audio"
    }
}
